<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾墨 · 文章搜集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@300;400;700&family=Noto+Serif+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f2ede1;
    --paper-2:#faf6ec;
    --ink:#1c1a17;
    --ink-2:#3d3a34;
    --ink-3:#6b665c;
    --ink-faint:#9a948a;
    --cinnabar:#a03a2a;
    --line:rgba(28,26,23,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'LXGW WenKai TC','Noto Serif TC','Songti TC','STSong','SimSun',serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      radial-gradient(ellipse at 12% 0%, rgba(255,255,255,.5), transparent 55%),
      radial-gradient(ellipse at 88% 100%, rgba(28,26,23,.05), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='linear' slope='0.05'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    min-height:100vh;
  }
  .hidden{display:none!important}

  /* ---------- 卷首（hero） ---------- */
  .hero{
    position:relative;
    min-height:58vh;
    display:flex;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }
  .hero-art{position:absolute;inset:0;pointer-events:none}
  .hero-art .mountains{position:absolute;bottom:0;left:0;width:100%;height:100%}
  .hero-art .decor-sky{position:absolute;top:7%;right:5%;width:clamp(130px,17vw,230px);opacity:.9}
  .hero-art .decor-boat{position:absolute;left:6%;bottom:26px;width:clamp(80px,9vw,120px)}
  .hero-inner{
    position:relative;z-index:2;
    width:100%;max-width:1080px;margin:0 auto;
    padding:70px 6vw 46px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
  }
  .hero-title h1{
    font-family:'LXGW WenKai TC','Kaiti TC','STKaiti','KaiTi',serif;
    font-size:clamp(3.4rem,9vw,6.4rem);
    font-weight:700;
    letter-spacing:.22em;
    line-height:1.1;
    display:inline-block;
    animation:fadeDown .8s ease both;
  }
  .seal{
    display:inline-grid;place-items:center;
    width:52px;height:52px;margin-left:14px;
    background:var(--cinnabar);color:#f7f1e3;
    border-radius:5px;font-size:1.5rem;letter-spacing:0;
    box-shadow:inset 0 0 8px rgba(0,0,0,.35), 2px 3px 10px rgba(28,26,23,.2);
    transform:rotate(-4deg) translateY(-6px);
    animation:stamp .55s cubic-bezier(.2,1.5,.4,1) .3s both;
  }
  @keyframes stamp{from{transform:rotate(-4deg) scale(1.7) translateY(-6px);opacity:0}}
  .brush{display:block;width:230px;margin-top:14px;animation:fadeDown .8s ease .15s both}
  .hero-sub{
    margin-top:16px;letter-spacing:.5em;
    color:var(--ink-3);font-size:.95rem;
    animation:fadeDown .8s ease .25s both;
  }
  .hero-quote{
    text-align:center;color:var(--ink-3);
    letter-spacing:.4em;font-size:1rem;line-height:2.2;
    white-space:nowrap;
    animation:fadeDown .9s ease .4s both;
  }
  .hero-quote .v1{writing-mode:vertical-rl;display:inline-block}
  .hero-quote .v2{
    writing-mode:vertical-rl;display:inline-block;
    margin-left:14px;font-size:.8rem;color:var(--ink-faint);letter-spacing:.3em;
  }
  .hero-quote .dot{
    display:block;width:5px;height:5px;border-radius:50%;
    background:var(--cinnabar);opacity:.65;margin:0 auto 10px;
  }
  @keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}}

  /* ---------- 主體 ---------- */
  .wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 6vw 60px}
  .toolbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;
    margin:36px 0 10px;
  }
  .search{
    flex:1 1 240px;max-width:340px;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--ink-3);padding:6px 4px;
    transition:border-color .25s;
  }
  .search:focus-within{border-bottom-color:var(--ink)}
  .search svg{flex:none;opacity:.6}
  .search input{
    width:100%;border:none;background:transparent;outline:none;
    font-family:inherit;font-size:1.05rem;color:var(--ink);
  }
  .search input::placeholder{color:var(--ink-faint);letter-spacing:.1em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%}
  .chip{
    font-family:inherit;font-size:.88rem;letter-spacing:.08em;
    color:var(--ink-2);background:transparent;
    border:1px solid var(--line);border-radius:999px;
    padding:4px 15px;cursor:pointer;transition:all .25s;
  }
  .chip:hover{border-color:var(--ink-3)}
  .chip.active{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
  .btn{
    position:relative;overflow:hidden;cursor:pointer;
    font-family:inherit;font-size:1rem;letter-spacing:.3em;
    color:var(--ink);background:transparent;
    border:1px solid var(--ink);border-radius:4px;
    padding:9px 26px;transition:color .35s;
  }
  .btn::before{
    content:'';position:absolute;left:50%;top:50%;
    width:10px;height:10px;border-radius:50%;
    background:radial-gradient(circle,var(--ink) 55%, rgba(28,26,23,.85));
    transform:translate(-50%,-50%) scale(0);
    transition:transform .5s cubic-bezier(.3,.8,.4,1);
  }
  .btn:hover{color:var(--paper-2)}
  .btn:hover::before{transform:translate(-50%,-50%) scale(30)}
  .btn span{position:relative;z-index:1}

  .sec-head{display:flex;align-items:center;gap:18px;margin:44px 0 26px}
  .sec-head h2{
    font-size:1.15rem;font-weight:500;letter-spacing:.6em;
    color:var(--ink-2);white-space:nowrap;
  }
  .sec-line{flex:1;height:1px;background:var(--line)}
  .sec-head .seal-mini{
    width:26px;height:26px;background:var(--cinnabar);color:#f7f1e3;
    display:grid;place-items:center;font-size:.85rem;border-radius:3px;
    box-shadow:inset 0 0 4px rgba(0,0,0,.35);
    transform:rotate(-5deg);
  }

  /* ---------- 卡片 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{
    display:flex;gap:12px;
    background:var(--paper-2);
    border:1px solid var(--line);border-radius:6px 6px 12px 12px;
    padding:22px 14px 14px 22px;
    box-shadow:0 2px 10px rgba(28,26,23,.05);
    cursor:pointer;
    transition:transform .3s, box-shadow .3s, border-color .3s;
    animation:rise .5s ease both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}}
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 28px rgba(28,26,23,.11);
    border-color:rgba(28,26,23,.24);
  }
  .card-main{flex:1;min-width:0}
  .card h3{
    display:inline-block;position:relative;
    font-family:'LXGW WenKai TC','Kaiti TC','STKaiti','KaiTi',serif;
    font-size:1.42rem;font-weight:700;letter-spacing:.08em;line-height:1.4;
  }
  .card h3::after{
    content:'';position:absolute;left:0;right:0;bottom:-4px;height:6px;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 8' preserveAspectRatio='none'><path d='M2 4 Q 22 1 42 4 T 78 4' fill='none' stroke='%231c1a17' stroke-width='2.4' stroke-linecap='round' opacity='.5'/></svg>") no-repeat center/100% 100%;
    transform:scaleX(0);transform-origin:left;transition:transform .4s;
  }
  .card:hover h3::after{transform:scaleX(1)}
  .card-meta{margin-top:8px;color:var(--ink-3);font-size:.88rem;letter-spacing:.08em}
  .card-quote{
    margin-top:12px;font-size:.93rem;color:var(--ink-2);line-height:1.8;
    padding-left:12px;border-left:2px solid rgba(160,58,42,.4);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-tags{margin-top:12px}
  .tag{
    display:inline-block;font-size:.76rem;letter-spacing:.06em;
    color:var(--ink-3);border:1px solid var(--line);border-radius:999px;
    padding:1px 10px;margin:0 6px 6px 0;
  }
  .card-foot{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);
  }
  .card-foot time{font-size:.78rem;color:var(--ink-faint);letter-spacing:.06em}
  .card-actions{display:flex;gap:2px;opacity:0;transition:opacity .25s}
  .card:hover .card-actions{opacity:1}
  .mini{
    font-family:inherit;font-size:.82rem;letter-spacing:.1em;
    background:none;border:none;border-radius:3px;
    color:var(--ink-3);cursor:pointer;padding:2px 7px;
  }
  .mini:hover{color:var(--ink);background:rgba(28,26,23,.06)}
  .mini.act-del:hover{color:var(--cinnabar);background:rgba(160,58,42,.08)}
  .mini[data-arm]{color:var(--cinnabar);font-weight:700}
  .card-side{
    flex:none;position:relative;
    writing-mode:vertical-rl;letter-spacing:.35em;
    color:var(--ink-faint);font-size:.82rem;
    border-left:1px dashed var(--line);padding-left:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .card-side::before{
    content:'';position:absolute;top:0;left:-3px;
    width:5px;height:5px;border-radius:50%;
    background:var(--cinnabar);opacity:.7;
  }

  /* ---------- 空狀態 ---------- */
  .empty{text-align:center;padding:70px 20px}
  .empty-glyph{
    width:92px;height:92px;margin:0 auto 22px;
    display:grid;place-items:center;
    border:1px solid var(--line);border-radius:50%;
    font-size:2.6rem;color:rgba(28,26,23,.16);
  }
  .empty h3{font-weight:500;letter-spacing:.4em;color:var(--ink-2);font-size:1.15rem}
  .empty p{margin-top:12px;color:var(--ink-faint);letter-spacing:.12em;font-size:.92rem}

  /* ---------- 來稿 ---------- */
  .pub-badge{
    display:inline-block;font-size:.72rem;letter-spacing:.1em;
    color:var(--cinnabar);border:1px solid rgba(160,58,42,.5);border-radius:3px;
    padding:1px 8px;margin-left:8px;
  }
  .submit-note{
    margin-top:14px;text-align:center;color:var(--ink-faint);
    font-size:.85rem;letter-spacing:.12em;
  }

  /* ---------- 彈窗 ---------- */
  .modal{
    position:fixed;inset:0;z-index:50;
    background:rgba(28,26,23,.38);
    backdrop-filter:blur(3px);
    display:grid;place-items:center;padding:24px;
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .modal.open{opacity:1;pointer-events:auto}
  .sheet{
    width:min(620px,100%);max-height:86vh;overflow:auto;
    background:var(--paper-2);
    border:1px solid var(--line);border-radius:8px;
    box-shadow:0 26px 60px rgba(28,26,23,.28);
    padding:26px 32px 30px;
    transform:translateY(16px);transition:transform .3s;
  }
  .modal.open .sheet{transform:none}
  .sheet-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:8px;
  }
  .sheet-head h3{font-weight:500;letter-spacing:.45em;font-size:1.05rem}
  .sheet-close{
    background:none;border:none;cursor:pointer;
    font-size:1.35rem;color:var(--ink-3);padding:2px 8px;line-height:1;
  }
  .sheet-close:hover{color:var(--ink)}

  /* 閱讀模式 */
  .view-title{
    font-family:'LXGW WenKai TC','Kaiti TC','STKaiti','KaiTi',serif;
    font-size:1.85rem;font-weight:700;letter-spacing:.1em;line-height:1.4;
    margin-top:10px;
  }
  .view-meta{margin-top:10px;color:var(--ink-3);font-size:.9rem;letter-spacing:.08em}
  .view-tags{margin-top:12px}
  blockquote{
    margin-top:20px;padding:8px 0 8px 18px;
    border-left:3px solid rgba(160,58,42,.45);
    color:var(--ink-2);font-size:1.06rem;line-height:2;letter-spacing:.04em;
  }
  .view-note{margin-top:24px}
  .view-note h4{
    font-size:.85rem;font-weight:500;letter-spacing:.4em;color:var(--ink-faint);
    margin-bottom:8px;
  }
  .view-note p{color:var(--ink-2);line-height:2;font-size:.98rem}
  .view-actions{
    margin-top:26px;padding-top:18px;border-top:1px dashed var(--line);
    display:flex;gap:10px;justify-content:flex-end;
  }

  /* 編輯模式 */
  .form .row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .field label{
    display:block;margin:20px 0 6px;
    font-size:.88rem;letter-spacing:.25em;color:var(--ink-3);
  }
  .field input,.field textarea{
    width:100%;border:none;border-bottom:1px solid var(--line);
    background:transparent;outline:none;
    font-family:inherit;font-size:1.05rem;color:var(--ink);
    padding:6px 2px;transition:border-color .25s;border-radius:0;
  }
  .field input:focus,.field textarea:focus{border-bottom-color:var(--ink)}
  .field input::placeholder,.field textarea::placeholder{color:var(--ink-faint)}
  .field textarea{resize:vertical;line-height:1.9}
  .form-actions{
    margin-top:30px;display:flex;justify-content:flex-end;gap:12px;align-items:center;
  }
  .btn-mini{
    font-family:inherit;font-size:.9rem;letter-spacing:.18em;
    color:var(--ink-2);background:transparent;text-decoration:none;
    border:1px solid var(--line);border-radius:4px;
    padding:6px 16px;cursor:pointer;display:inline-block;transition:all .25s;
  }
  .btn-mini:hover{border-color:var(--ink);color:var(--ink)}
  .btn-mini.danger:hover{border-color:var(--cinnabar);color:var(--cinnabar)}

  /* ---------- 頁尾 ---------- */
  footer{
    position:relative;z-index:1;
    border-top:1px solid var(--line);
    padding:34px 6vw 44px;text-align:center;
  }
  .foot-quote{
    writing-mode:vertical-rl;display:inline-block;
    letter-spacing:.5em;color:var(--ink-3);font-size:1rem;line-height:2.4;
  }
  .foot-actions{display:flex;justify-content:center;gap:12px;margin-top:22px}
  .foot-meta{margin-top:20px;color:var(--ink-faint);font-size:.85rem;letter-spacing:.15em;line-height:2}
  .foot-meta b{color:var(--ink-3);font-weight:700}

  /* ---------- 浮水印 / 提示 ---------- */
  .watermark{
    position:fixed;right:6px;bottom:20px;z-index:0;
    writing-mode:vertical-rl;letter-spacing:.3em;
    font-size:10rem;line-height:1;
    color:rgba(28,26,23,.045);
    pointer-events:none;user-select:none;
  }
  .toast{
    position:fixed;left:50%;bottom:30px;z-index:60;
    transform:translate(-50%,20px);opacity:0;
    background:var(--ink);color:var(--paper-2);
    padding:10px 24px;border-radius:4px;
    font-size:.95rem;letter-spacing:.15em;
    transition:all .35s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:720px){
    .hero-quote{display:none}
    .hero-inner{padding-top:56px}
    .form .row2{grid-template-columns:1fr}
    .toolbar .btn{margin-left:auto}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

<!-- 卷首 -->
<header class="hero">
  <div class="hero-art" aria-hidden="true">
    <svg class="mountains" viewBox="0 0 1440 300" preserveAspectRatio="none">
      <!-- 遠山（淡墨） -->
      <path d="M0 210 L90 168 L180 200 L300 140 L420 196 L540 150 L660 205 L780 148 L900 200 L1020 156 L1140 198 L1260 150 L1380 190 L1440 176 L1440 300 L0 300 Z" fill="#1c1a17" opacity=".10"/>
      <!-- 嵐氣 -->
      <ellipse cx="250" cy="205" rx="260" ry="9" fill="#faf6ec" opacity=".45"/>
      <!-- 中山（灰墨） -->
      <path d="M0 240 L110 196 L240 236 L360 180 L500 240 L620 190 L760 242 L880 186 L1020 238 L1160 192 L1300 240 L1440 210 L1440 300 L0 300 Z" fill="#1c1a17" opacity=".20"/>
      <ellipse cx="720" cy="252" rx="330" ry="10" fill="#faf6ec" opacity=".4"/>
      <!-- 近山（濃墨） -->
      <path d="M0 272 L100 240 L230 270 L370 226 L520 272 L660 232 L800 274 L940 230 L1080 272 L1220 238 L1340 268 L1440 252 L1440 300 L0 300 Z" fill="#1c1a17" opacity=".36"/>
      <!-- 山紋皴筆 -->
      <g stroke="#1c1a17" stroke-width="2" stroke-linecap="round" fill="none" opacity=".30">
        <path d="M520 272 l-6 -16 M660 232 l-4 -13 M940 230 l7 -15 M1220 238 l-6 -13 M230 270 l-5 -12"/>
      </g>
      <!-- 水面 -->
      <g stroke="#1c1a17" stroke-width="1.5" fill="none" opacity=".12">
        <path d="M0 284 Q 240 280 480 284 T 960 284 T 1440 284"/>
        <path d="M0 292 Q 260 289 520 292 T 1040 292 T 1440 292"/>
      </g>
    </svg>
    <svg class="decor-sky" viewBox="0 0 200 140">
      <circle cx="146" cy="46" r="27" fill="#a03a2a" opacity=".48"/>
      <g stroke="#1c1a17" stroke-width="2" fill="none" stroke-linecap="round" opacity=".7">
        <path d="M52 26 Q 58 19 64 26 Q 70 19 76 26"/>
        <path d="M86 44 Q 91 38 96 44 Q 101 38 106 44"/>
        <path d="M32 52 Q 37 46 42 52 Q 47 46 52 52"/>
      </g>
    </svg>
    <svg class="decor-boat" viewBox="0 0 120 80">
      <g stroke="#1c1a17" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".5">
        <path d="M16 56 Q 60 70 104 56 L 96 63 Q 60 71 24 63 Z" fill="#1c1a17" opacity=".45" stroke="none"/>
        <line x1="58" y1="57" x2="58" y2="16"/>
        <line x1="58" y1="22" x2="90" y2="34"/>
        <path d="M48 34 Q 52 27 58 30"/>
      </g>
    </svg>
  </div>
  <div class="hero-inner">
    <div class="hero-title">
      <div>
        <h1>拾墨</h1><span class="seal">藏</span>
      </div>
      <svg class="brush" viewBox="0 0 220 16" aria-hidden="true">
        <path d="M8 9 C 40 3, 66 13, 96 6 C 126 -1, 150 12, 176 7 C 196 4, 206 8, 214 8 L 213 12 C 180 13, 156 10, 130 12 C 104 14, 74 12, 48 13 C 26 14, 14 11, 7 12 Z" fill="#1c1a17" opacity=".85"/>
      </svg>
      <p class="hero-sub">文章搜集 · 紙上風景</p>
    </div>
    <div class="hero-quote" aria-hidden="true">
      <span class="v1"><span class="dot"></span>書卷多情似故人</span>
      <span class="v2">—— 明·于謙</span>
    </div>
  </div>
</header>

<!-- 主體 -->
<main class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1c1a17" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20 L16.5 16.5"/>
      </svg>
      <input id="q" type="text" placeholder="搜尋標題、作者、摘錄……">
    </label>
    <button class="btn" id="btnAdd"><span>＋ 添文</span></button>
    <div class="chips" id="tagChips"></div>
  </div>

  <div class="sec-head">
    <span class="seal-mini">集</span>
    <h2>文 集</h2>
    <span class="sec-line"></span>
  </div>

  <section class="grid" id="grid"></section>

  <div class="empty hidden" id="empty">
    <div class="empty-glyph">文</div>
    <h3 id="emptyTitle">此處尚無文章</h3>
    <p id="emptyHint">點擊「添文」，開始搜集你的紙上風景。</p>
  </div>

  <div id="pubSection">
    <div class="sec-head">
      <span class="seal-mini">稿</span>
      <h2>文友來稿</h2>
      <span class="sec-line"></span>
      <button class="btn" id="btnSubmit"><span>投 稿</span></button>
    </div>

    <section class="grid" id="pubGrid"></section>

    <div class="empty hidden" id="pubEmpty">
      <div class="empty-glyph">稿</div>
      <h3 id="pubEmptyTitle">尚無來稿</h3>
      <p id="pubEmptyHint">點右上「投稿」，成為第一位文友。</p>
      <div style="margin-top:16px"><button class="btn-mini hidden" id="btnPubRetry">再試一次</button></div>
    </div>
  </div>
</main>

<!-- 彈窗 -->
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="modalTitle">添 文</h3>
      <button class="sheet-close" id="btnClose" aria-label="關閉">✕</button>
    </div>
    <div class="sheet-body">

      <!-- 閱讀模式 -->
      <div id="viewMode" class="hidden">
        <div id="viewBox"></div>
        <div class="view-actions">
          <button class="btn-mini" id="btnViewEdit">修 改</button>
          <button class="btn-mini danger" id="btnViewDelete">刪 除</button>
          <button class="btn-mini" id="btnViewClose">關 閉</button>
        </div>
      </div>

      <!-- 編輯模式 -->
      <form class="form hidden" id="editForm">
        <div class="row2">
          <div class="field">
            <label for="f-title">標題 ＊</label>
            <input id="f-title" required>
          </div>
          <div class="field">
            <label for="f-author">作者</label>
            <input id="f-author" placeholder="佚名">
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-source">出處（書刊／網站）</label>
            <input id="f-source">
          </div>
          <div class="field">
            <label for="f-url">連結</label>
            <input id="f-url" placeholder="https://…">
          </div>
        </div>
        <div class="field">
          <label for="f-tags">標籤（以逗號分隔）</label>
          <input id="f-tags" placeholder="散文、回憶、母愛">
        </div>
        <div class="field">
          <label for="f-quote">摘錄</label>
          <textarea id="f-quote" rows="3" placeholder="打動你的原句……"></textarea>
        </div>
        <div class="field">
          <label for="f-note">心得</label>
          <textarea id="f-note" rows="4" placeholder="讀後所想、可學的筆法……"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-mini" id="btnCancel">取 消</button>
          <button type="submit" class="btn"><span>存 之</span></button>
        </div>
      </form>

    </div>
  </div>
</div>

<!-- 投稿彈窗 -->
<div class="modal" id="submitModal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div class="sheet-head">
      <h3>投 稿</h3>
      <button class="sheet-close" id="btnSubmitClose" aria-label="關閉">✕</button>
    </div>
    <div class="sheet-body">
      <form class="form" id="submitForm">
        <div class="row2">
          <div class="field">
            <label for="p-title">標題 ＊</label>
            <input id="p-title" required>
          </div>
          <div class="field">
            <label for="p-author">筆名</label>
            <input id="p-author" placeholder="佚名">
          </div>
        </div>
        <div class="field">
          <label for="p-tags">標籤（以逗號分隔）</label>
          <input id="p-tags" placeholder="散文、回憶">
        </div>
        <div class="field">
          <label for="p-body">正文 ＊</label>
          <textarea id="p-body" rows="10" placeholder="把想分享的文章貼在這裡……"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-mini" id="btnSubmitCancel">取 消</button>
          <button type="submit" class="btn"><span>送 出</span></button>
        </div>
      </form>
      <p class="submit-note">送出後需經審核，通過後才會公開於「文友來稿」。</p>
    </div>
  </div>
</div>

<footer>
  <span class="foot-quote">紙墨相守 · 歲月長存</span>
  <div class="foot-actions">
    <button class="btn-mini" id="btnExport">匯出備份</button>
    <button class="btn-mini" id="btnImport">匯入備份</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
  <p class="foot-meta">共 <b id="count">0</b> 篇 · 資料存於瀏覽器本地<br>點擊卡片可覽全文</p>
</footer>

<div class="watermark" aria-hidden="true">文</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';
  const STORE = 'shimo-articles-v1';   // 收藏清單
  const HIDDEN = 'shimo-hidden-v1';    // 已刪除的主檔文章（避免自動復活）
  // Supabase 後台連線
  const SUPABASE_URL = 'https://yrjudgplqgnkhinngkih.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlyanVkZ3BscWdua2hpbm5na2loIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjYwNjUsImV4cCI6MjEwMzg0MjA2NX0.WRCBleU4P-nnJmH7U4Mc6vF8VOJgZMmaOty8qFye4F8';
  const SUPABASE_READY = !SUPABASE_URL.includes('YOUR-PROJECT');
  const $ = id => document.getElementById(id);

  let articles = [];
  let hidden = [];
  let query = '';
  let filterTag = null;
  let mode = 'add';          // add | view | edit
  let current = null;
  let delTimer = null;
  let toastTimer = null;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const trunc = (s, n) => s.length > n ? s.slice(0, n) + '…' : s;
  const fmtDate = iso => {
    const d = new Date(iso);
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  };

  // 主檔文章（網站固定內容；日後新收錄由主檔更新，自動出現在每個人的網頁上）
  const MASTER = [
    { id:'m1', title:'我與地壇', author:'史鐵生', source:'《我與地壇》', url:'', tags:['史鐵生','回憶','散文'], added:'2026-08-28',
      quote:'死是一件不必急於求成的事，死是一個必然會降臨的節日。',
      note:'學習「譬如」式的景物排比——落日、雨燕、古柏，用景物寫時間，讓園子替人記住一切。' },
    { id:'m2', title:'秋天的懷念', author:'史鐵生', source:'《秋天的懷念》', url:'', tags:['史鐵生','母愛','回憶'], added:'2026-08-29',
      quote:'咱娘兒倆在一塊兒，好好兒活，好好兒活……',
      note:'雙重視角的典範：昔日之我渾然不覺，現在之我悔悟終生。「她出去了，就再也沒有回來」——獨句成段，一擊即中。' },
    { id:'m3', title:'病隙碎筆', author:'史鐵生', source:'《病隙碎筆》', url:'', tags:['史鐵生','哲思'], added:'2026-08-30',
      quote:'我們遭遇痛苦，超越局限，從而感受幸福。所以一切人都是平等的，我們毫不特殊。',
      note:'寫苦難而不訴苦，把病痛寫成沉思。適合放在文章過渡段的自問自答。' },
    { id:'m4', title:'合歡樹', author:'史鐵生', source:'《合歡樹》', url:'', tags:['史鐵生','母愛','回憶'], added:'2026-08-31',
      quote:'上帝看她受不住了，就召她回去。',
      note:'母親的影子藏在樹裡——以物代人，以樹寫思念，一句怨言也無，卻字字是淚。' },
  ];

  /* ---------- 存取 ---------- */
  function load() {
    try {
      let items = JSON.parse(localStorage.getItem(STORE));
      if (!Array.isArray(items)) items = [];
      hidden = JSON.parse(localStorage.getItem(HIDDEN));
      if (!Array.isArray(hidden)) hidden = [];
      // 舊資料遷移：主檔文章改用穩定 id，避免與新主檔重複
      items.forEach(it => {
        const m = MASTER.find(x => x.title === it.title);
        if (m) it.id = m.id;
      });
      // 合併主檔：新收錄的文章自動出現在每個人的網頁上
      MASTER.forEach(m => {
        if (!items.some(i => i.id === m.id) && !hidden.includes(m.title)) {
          items.push({ ...m });
        }
      });
      localStorage.setItem(STORE, JSON.stringify(items));
      persistHidden();
      return items;
    } catch (e) {
      return MASTER.map(m => ({ ...m }));
    }
  }
  function persist() {
    try { localStorage.setItem(STORE, JSON.stringify(articles)); }
    catch (e) { toast('儲存失敗：瀏覽器不允許本地儲存'); }
  }
  function persistHidden() {
    try { localStorage.setItem(HIDDEN, JSON.stringify(hidden)); }
    catch (e) {}
  }
  function removeArticle(id) {
    const it = articles.find(a => a.id === id);
    if (it && MASTER.some(m => m.id === it.id) && !hidden.includes(it.title)) {
      hidden.push(it.title);
    }
    articles = articles.filter(a => a.id !== id);
    persist(); persistHidden(); render();
  }

  /* ---------- 過濾與渲染 ---------- */
  function filtered() {
    const q = query.trim().toLowerCase();
    return articles
      .filter(a => !filterTag || (a.tags || []).includes(filterTag))
      .filter(a => !q || [a.title, a.author, a.source, a.quote, a.note]
        .some(v => (v || '').toLowerCase().includes(q)))
      .sort((a, b) => new Date(b.added) - new Date(a.added));
  }

  function cardHTML(a) {
    const tags = (a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    let excerpt = '';
    if (a.quote) excerpt = `<p class="card-quote">「${esc(trunc(a.quote, 64))}」</p>`;
    else if (a.note) excerpt = `<p class="card-quote">${esc(trunc(a.note, 64))}</p>`;
    return `
      <article class="card" data-id="${esc(a.id)}">
        <div class="card-main">
          <h3>${esc(a.title)}</h3>
          <p class="card-meta">${esc(a.author || '佚名')}${a.source ? ' · ' + esc(a.source) : ''}</p>
          ${excerpt}
          <div class="card-tags">${tags}</div>
          <div class="card-foot">
            <time>${fmtDate(a.added)}</time>
            <div class="card-actions">
              <button class="mini act-edit">改</button>
              <button class="mini act-del">刪</button>
            </div>
          </div>
        </div>
        <div class="card-side"><span>${esc((a.tags && a.tags[0]) || '文')}</span></div>
      </article>`;
  }

  function showEmpty(title, hint) {
    $('emptyTitle').textContent = title;
    $('emptyHint').textContent = hint;
    $('empty').classList.remove('hidden');
  }

  function render() {
    const grid = $('grid');
    grid.innerHTML = '';
    const list = filtered();
    $('empty').classList.add('hidden');
    if (articles.length === 0) {
      showEmpty('此處尚無文章', '點擊「添文」，開始搜集你的紙上風景。');
    } else if (list.length === 0) {
      showEmpty('無符合的文章', '換個關鍵字或標籤試試。');
    } else {
      list.forEach((a, i) => {
        const el = document.createElement('div');
        el.innerHTML = cardHTML(a);
        el.style.animationDelay = (i * 55) + 'ms';
        const card = el.firstElementChild;
        card.addEventListener('click', () => openView(a));
        card.querySelector('.act-edit').addEventListener('click', e => { e.stopPropagation(); openEdit(a); });
        const delBtn = card.querySelector('.act-del');
        delBtn.addEventListener('click', e => {
          e.stopPropagation();
          if (delBtn.dataset.arm) {
            removeArticle(a.id); toast('已移除');
          } else {
            delBtn.dataset.arm = '1';
            delBtn.textContent = '確?';
            clearTimeout(delTimer);
            delTimer = setTimeout(() => { delete delBtn.dataset.arm; delBtn.textContent = '刪'; }, 2200);
          }
        });
        grid.appendChild(card);
      });
    }
    renderChips();
    $('count').textContent = articles.length;
  }

  function renderChips() {
    const tags = [...new Set(articles.flatMap(a => a.tags || []))];
    const box = $('tagChips');
    let html = `<button class="chip ${filterTag ? '' : 'active'}" data-tag="">全部</button>`;
    tags.forEach(t => { html += `<button class="chip ${filterTag === t ? 'active' : ''}" data-tag="${esc(t)}">${esc(t)}</button>`; });
    box.innerHTML = html;
    box.querySelectorAll('.chip').forEach(b =>
      b.addEventListener('click', () => { filterTag = b.dataset.tag || null; render(); }));
  }

  /* ---------- 彈窗 ---------- */
  function openModal() { $('modal').classList.add('open'); }
  function closeModal() { $('modal').classList.remove('open'); current = null; }
  function showView() { $('viewMode').classList.remove('hidden'); $('editForm').classList.add('hidden'); }
  function showForm() { $('editForm').classList.remove('hidden'); $('viewMode').classList.add('hidden'); }

  function openAdd() {
    mode = 'add'; current = null;
    $('modalTitle').textContent = '添 文';
    $('editForm').reset();
    showForm(); openModal();
    setTimeout(() => $('f-title').focus(), 250);
  }

  function openView(a) {
    mode = 'view'; current = a;
    const isPost = !!a.body;
    $('modalTitle').textContent = isPost ? '來 稿' : '文 章';
    $('btnViewEdit').classList.toggle('hidden', isPost);
    $('btnViewDelete').classList.toggle('hidden', isPost);
    const tags = (a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    const when = fmtDate(a.added || a.created_at);
    const meta = isPost
      ? `${esc(a.author || '佚名')} 投稿於 ${when}`
      : `${esc(a.author || '佚名')}${a.source ? ' · ' + esc(a.source) : ''} · 藏於 ${when}`;
    let html = `
      <h2 class="view-title">${esc(a.title)}</h2>
      <p class="view-meta">${meta}</p>
      <div class="view-tags">${tags}</div>`;
    if (a.body) html += `<div class="view-note" style="margin-top:20px"><p>${esc(a.body).replace(/\n/g, '<br>')}</p></div>`;
    if (a.quote) html += `<blockquote>${esc(a.quote)}</blockquote>`;
    if (a.note) html += `<div class="view-note"><h4>心 得</h4><p>${esc(a.note).replace(/\n/g, '<br>')}</p></div>`;
    if (a.url) html += `<div style="margin-top:22px"><a class="btn-mini" href="${esc(a.url)}" target="_blank" rel="noopener">前往出處 ↗</a></div>`;
    $('viewBox').innerHTML = html;
    showView(); openModal();
  }

  function openEdit(a) {
    mode = 'edit'; current = a;
    $('modalTitle').textContent = '修 文';
    $('f-title').value = a.title || '';
    $('f-author').value = a.author || '';
    $('f-source').value = a.source || '';
    $('f-url').value = a.url || '';
    $('f-tags').value = (a.tags || []).join('、');
    $('f-quote').value = a.quote || '';
    $('f-note').value = a.note || '';
    showForm(); openModal();
  }

  function saveFromForm() {
    const data = {
      title: $('f-title').value.trim(),
      author: $('f-author').value.trim(),
      source: $('f-source').value.trim(),
      url: $('f-url').value.trim(),
      tags: $('f-tags').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean),
      quote: $('f-quote').value.trim(),
      note: $('f-note').value.trim(),
    };
    if (!data.title) { toast('請填標題'); return; }
    if (mode === 'edit') {
      Object.assign(current, data);
      toast('已修改');
    } else {
      data.id = uid();
      data.added = new Date().toISOString();
      articles.push(data);
      toast('已添入集子');
    }
    persist(); render(); closeModal();
  }

  function deleteCurrent() {
    if (!current) return;
    removeArticle(current.id);
    closeModal(); toast('已移除');
  }

  /* ---------- 文友來稿（Supabase） ---------- */
  let pubPosts = null;

  function pubCardHTML(p) {
    const tags = (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
    return `
      <article class="card">
        <div class="card-main">
          <h3>${esc(p.title)}</h3>
          <p class="card-meta">${esc(p.author || '佚名')}</p>
          <p class="card-quote">${esc(trunc(p.body || '', 64))}</p>
          <div class="card-tags">${tags}</div>
          <div class="card-foot">
            <time>${fmtDate(p.created_at)}<span class="pub-badge">投稿</span></time>
          </div>
        </div>
        <div class="card-side"><span>稿</span></div>
      </article>`;
  }

  function renderPub() {
    const grid = $('pubGrid');
    grid.innerHTML = '';
    const empty = $('pubEmpty');
    $('btnPubRetry').classList.add('hidden');
    if (pubPosts === null) {
      empty.classList.remove('hidden');
      $('pubEmptyTitle').textContent = '連不上後台';
      $('pubEmptyHint').textContent = '可能是網路問題，稍後再試。';
      $('btnPubRetry').classList.remove('hidden');
      return;
    }
    if (pubPosts.length === 0) {
      empty.classList.remove('hidden');
      $('pubEmptyTitle').textContent = '尚無來稿';
      $('pubEmptyHint').textContent = '點右上「投稿」，成為第一位文友。';
      return;
    }
    empty.classList.add('hidden');
    pubPosts.forEach((p, i) => {
      const el = document.createElement('div');
      el.innerHTML = pubCardHTML(p);
      const card = el.firstElementChild;
      card.style.animationDelay = (i * 55) + 'ms';
      card.addEventListener('click', () => openView(p));
      grid.appendChild(card);
    });
  }

  async function fetchPub() {
    if (!SUPABASE_READY) return;
    pubPosts = null;
    renderPub();
    try {
      const r = await fetch(`${SUPABASE_URL}/rest/v1/posts?approved=eq.true&order=created_at.desc&limit=50`, {
        headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
      });
      if (!r.ok) throw 0;
      pubPosts = await r.json();
    } catch (e) { pubPosts = null; }
    renderPub();
  }

  async function submitPost(data) {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/posts`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(data)
    });
    return r.ok;
  }

  function openSubmit() { $('submitModal').classList.add('open'); setTimeout(() => $('p-title').focus(), 250); }
  function closeSubmit() { $('submitModal').classList.remove('open'); }

  async function handleSubmit(e) {
    e.preventDefault();
    const title = $('p-title').value.trim();
    const body = $('p-body').value.trim();
    if (!title || !body) { toast('請填標題與正文'); return; }
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const ok = await submitPost({
      title,
      body,
      author: $('p-author').value.trim() || '佚名',
      tags: $('p-tags').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean)
    });
    btn.disabled = false;
    if (ok) {
      $('submitForm').reset();
      closeSubmit();
      toast('已送出，審核通過後公開');
    } else {
      toast('送出失敗，請稍後再試');
    }
  }

  /* ---------- 備份 ---------- */
  function exportJSON() {
    const blob = new Blob([JSON.stringify(articles, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '拾墨-文章搜集備份.json';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('已匯出備份');
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = JSON.parse(reader.result);
        if (!Array.isArray(arr)) throw 0;
        const map = new Map(articles.map(a => [a.id, a]));
        arr.forEach(x => {
          if (x && typeof x === 'object') {
            x.id = x.id || uid();
            x.added = x.added || new Date().toISOString();
            x.tags = Array.isArray(x.tags) ? x.tags : [];
            map.set(x.id, x);
          }
        });
        articles = [...map.values()];
        persist(); render();
        toast('已匯入 ' + arr.length + ' 篇');
      } catch (e) { toast('匯入失敗：檔案格式不符'); }
    };
    reader.readAsText(file);
  }

  /* ---------- 提示 ---------- */
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  /* ---------- 事件綁定 ---------- */
  $('q').addEventListener('input', e => { query = e.target.value; render(); });
  $('btnAdd').addEventListener('click', openAdd);
  $('btnClose').addEventListener('click', closeModal);
  $('btnCancel').addEventListener('click', closeModal);
  $('btnViewClose').addEventListener('click', closeModal);
  $('btnViewEdit').addEventListener('click', () => { if (current) openEdit(current); });
  $('btnViewDelete').addEventListener('click', deleteCurrent);
  $('editForm').addEventListener('submit', e => { e.preventDefault(); saveFromForm(); });
  $('btnExport').addEventListener('click', exportJSON);
  $('btnImport').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', e => {
    if (e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = '';
  });
  $('btnSubmit').addEventListener('click', openSubmit);
  $('btnSubmitClose').addEventListener('click', closeSubmit);
  $('btnSubmitCancel').addEventListener('click', closeSubmit);
  $('submitForm').addEventListener('submit', handleSubmit);
  $('btnPubRetry').addEventListener('click', fetchPub);
  $('submitModal').addEventListener('click', e => { if (e.target === $('submitModal')) closeSubmit(); });
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeSubmit(); } });

  /* ---------- 啟動 ---------- */
  articles = load();
  render();
  if (!SUPABASE_READY) {
    $('pubSection').classList.add('hidden');
  } else {
    fetchPub();
  }
})();
</script>
</body>
</html>
